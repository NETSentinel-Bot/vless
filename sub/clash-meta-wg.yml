    - tls://8.8.4.4
    - tls://1.0.0.1
    - tls://223.6.6.6
  proxy-server-nameserver:
    - 8.8.8.8#DIRECT
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"

tun:
  enable: true
  mtu: 8880
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  endpoint-independent-nat: false
